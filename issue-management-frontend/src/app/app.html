<div class="app-layout">
  <!-- Top Navigation Header -->
  <app-header
    [searchQuery]="searchQuery()"
    (searchQueryChange)="searchQuery.set($event)"
    [activeView]="activeView()"
    (activeViewChange)="activeView.set($event)"
    [isBackendConnected]="issueService.isBackendConnected()"
    (openCreateModal)="openCreateModal()"
  />

  <main class="main-content">
    <!-- Analytical Dashboard Counters -->
    <app-dashboard-stats
      [issues]="issueService.issues()"
      [selectedStatus]="statusFilter()"
      [selectedPriority]="priorityFilter()"
      (filterStatus)="handleFilterStatus($event)"
      (filterPriority)="handleFilterPriority($event)"
      (filterReset)="handleFilterReset()"
    />

    <!-- Main View Switcher (Table vs Kanban) -->
    @if (activeView() === 'table') {
      <app-issue-list
        [issues]="issueService.issues()"
        [searchQuery]="searchQuery()"
        [statusFilter]="statusFilter()"
        [priorityFilter]="priorityFilter()"
        (statusFilterChange)="statusFilter.set($event)"
        (priorityFilterChange)="priorityFilter.set($event)"
        (viewDetail)="openDetailModal($event)"
        (editIssue)="openEditModal($event)"
        (deleteIssue)="confirmDeleteIssue($event)"
        (statusChange)="requestStatusChange($event)"
      />
    } @else {
      <app-issue-kanban
        [issues]="issueService.issues()"
        [searchQuery]="searchQuery()"
        (viewDetail)="openDetailModal($event)"
        (statusChange)="requestStatusChange($event)"
      />
    }
  </main>

  <!-- Modals & Overlay Containers -->
  @if (isFormModalOpen()) {
    <app-issue-form-modal
      [issueToEdit]="issueToEdit()"
      [submitting]="isSubmitting()"
      (close)="closeFormModal()"
      (save)="requestSaveIssue($event)"
    />
  }

  @if (selectedDetailIssue()) {
    <app-issue-detail-modal
      [issue]="selectedDetailIssue()"
      (close)="closeDetailModal()"
      (edit)="openEditModal($event)"
      (delete)="confirmDeleteIssue($event)"
      (statusChange)="requestStatusChange($event)"
    />
  }

  <!-- Delete Warning Confirmation Modal -->
  <app-confirm-modal
    [isOpen]="!!issueToDelete()"
    title="Delete Issue"
    [message]="'Are you sure you want to delete issue #' + issueToDelete()?.id + ' (' + issueToDelete()?.title + ')? This action cannot be undone.'"
    confirmText="Delete Issue"
    confirmIcon="fa-trash-can"
    type="danger"
    (cancel)="cancelDelete()"
    (confirm)="executeDelete()"
  />

  <!-- Status Change Warning Confirmation Modal -->
  <app-confirm-modal
    [isOpen]="!!pendingStatusChange()"
    title="Confirm Status Change"
    [message]="'Are you sure you want to change status of Issue #' + pendingStatusChange()?.issue?.id + ' to ' + formatStatus(pendingStatusChange()?.newStatus) + '?'"
    confirmText="Change Status"
    confirmIcon="fa-arrows-rotate"
    type="warning"
    (cancel)="cancelStatusChange()"
    (confirm)="confirmStatusChange()"
  />

  <!-- Edit Confirmation Warning Modal -->
  <app-confirm-modal
    [isOpen]="!!pendingSaveIssue()"
    title="Confirm Save Changes"
    [message]="'Are you sure you want to save changes to Issue #' + pendingSaveIssue()?.id + ' (' + pendingSaveIssue()?.title + ')?'"
    confirmText="Save Changes"
    confirmIcon="fa-check"
    type="primary"
    (cancel)="cancelSaveIssue()"
    (confirm)="confirmSaveIssue()"
  />

  <!-- Floating Toast Notifications -->
  <app-toast-container />
</div>
